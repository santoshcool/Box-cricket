<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback + Search</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
       .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #25D366; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
       .submit { background: #34A853; color: white; }
       .whatsapp { background: #25D366; color: white; }
       .search { background: #4285F4; color: white; }
       .status { margin: 15px 0; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; }
       .error { background: #ffebee; color: #c62828; }
       .success { background: #e8f5e8; color: #2e7d32; }
       .result-table { width: 100%; margin-top: 20px; border-collapse: collapse; }
       .result-table th,.result-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
       .result-table th { background: #f8f8f8; }
       .section { border-top: 2px solid #eee; margin-top: 30px; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Customer Feedback</h1>

        <input type="text" id="name" placeholder="Customer Name">

        <div style="display:flex; gap:10px;">
            <select id="countryCode" style="width:150px;">
                <option value="91" selected>🇮🇳 +91</option>
                <option value="1">🇺🇸 +1</option>
                <option value="44">🇬🇧 +44</option>
                <option value="971">🇦🇪 +971</option>
            </select>
            <input type="tel" id="phone" placeholder="9876543210">
        </div>

        <textarea id="feedback" rows="4" placeholder="Enter feedback here..."></textarea>

        <div style="text-align:center; margin-top:15px;">
            <button class="submit" onclick="submitForm()">📤 Submit</button>
            <button class="whatsapp" onclick="openWhatsApp()">📱 Open WhatsApp</button>
        </div>

        <div id="status" class="status"></div>

        <!-- SEARCH SECTION -->
        <div class="section">
            <h2>🔍 Search Feedback</h2>
            <input type="text" id="searchQuery" placeholder="Search by name, phone, date, month... e.g. Santosh or July or 2026-07-14">
            <div style="text-align:center;">
                <button class="search" onclick="searchData()">Search</button>
                <button onclick="clearResults()">Clear</button>
            </div>
            <div id="searchResults"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDUKwKL1xRugTeMBjFC2TtP3CSsmCea2c5M1VEGO2__oPRDALA4PoNh8P9k6q5jhlq-w/exec";

        function openWhatsApp() {
            const country = document.getElementById("countryCode").value;
            const rawPhone = document.getElementById("phone").value.trim();
            const status = document.getElementById("status");

            if (!rawPhone) {
                status.className = "status error";
                status.innerHTML = "❌ Please enter phone number";
                return;
            }

            const cleanPhone = rawPhone.replace(/[^0-9]/g, '');
            const fullPhone = country + cleanPhone;

            // Just opens chat - no message pre-filled
            const url = `https://wa.me/${fullPhone}`;
            
            status.className = "status success";
            status.innerHTML = "Opening WhatsApp...";
            window.location.href = url;
        }

        async function submitForm() {
            const name = document.getElementById("name").value.trim();
            const feedback = document.getElementById("feedback").value.trim();
            const country = document.getElementById("countryCode").value;
            const phone = document.getElementById("phone").value.trim();
            const status = document.getElementById("status");

            if (!name ||!phone ||!feedback) {
                status.className = "status error";
                status.innerHTML = "❌ Please fill all fields";
                return;
            }

            status.className = "status";
            status.innerHTML = "⏳ Submitting...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'submit',
                        name: name,
                        phone: '+' + country + phone.replace(/[^0-9]/g, ''),
                        feedback: feedback,
                        timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
                    })
                });

                status.className = "status success";
                status.innerHTML = "✅ Submitted successfully!";
                document.getElementById("name").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("feedback").value = "";
            } catch (error) {
                status.className = "status error";
                status.innerHTML = "❌ Error submitting. Try again.";
            }
        }

        async function searchData() {
            const query = document.getElementById("searchQuery").value.trim();
            const resultsDiv = document.getElementById("searchResults");

            if (!query) {
                resultsDiv.innerHTML = '<div class="status error">❌ Enter something to search</div>';
                return;
            }

            resultsDiv.innerHTML = '<div class="status">⏳ Searching...</div>';

            try {
                const res = await fetch(`${SCRIPT_URL}?action=search&query=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.status === 'success' && data.results.length > 0) {
                    let html = `<table class="result-table">
                        <tr><th>Date</th><th>Name</th><th>Phone</th><th>Feedback</th></tr>`;

                    data.results.forEach(row => {
                        html += `<tr>
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                        </tr>`;
                    });
                    html += `</table><p><b>Found ${data.results.length} records</b></p>`;
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = '<div class="status error">❌ No records found</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<div class="status error">❌ Search failed. Check script URL.</div>';
            }
        }

        function clearResults() {
            document.getElementById("searchQuery").value = "";
            document.getElementById("searchResults").innerHTML = "";
        }
    </script>
</body>
</html>
